version: 2

models:
  - name: stg_ga4__events
    description: Thin staging model for GA4 raw events. Extracts core event fields and join keys for downstream analysis.

    columns:
      - name: event_key
        description: Unique surrogate key for each event row.
        tests:
          - not_null
          - unique

      - name: event_name
        description: Name of the GA4 event.
        tests:
          - not_null

      - name: user_pseudo_id
        description: Anonymous GA4 user identifier.
        tests:
          - not_null

      - name: session_key
        description: Session identifier built from user_pseudo_id and ga_session_id.

      - name: ga_session_id
        description: Raw GA session ID extracted from event_params.

      - name: event_date
        description: Event date parsed from the raw GA4 field.

      - name: event_timestamp
        description: Event timestamp converted from microseconds.

      - name: transaction_id
        description: Transaction ID extracted from event_params where available.