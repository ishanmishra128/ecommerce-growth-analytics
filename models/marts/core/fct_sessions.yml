version: 2
models:
  - name: fct_sessions
    description: Session-level fact table with one row per session_key.
    columns:
      - name: session_key
        description: Unique session identifier.
        tests:
          - not_null
          - unique

      - name: user_pseudo_id
        description: Anonymous GA4 user identifier.
        tests:
          - not_null

      - name: ga_session_id
        description: GA4 session identifier scoped to user.
        tests:
          - not_null

      - name: session_date
        description: Date of the session.
        tests:
          - not_null

      - name: session_start_ts
        description: Timestamp of the first event in the session.
        tests:
          - not_null

      - name: session_end_ts
        description: Timestamp of the last event in the session.
        tests:
          - not_null
